# Railway — deploy bằng Dockerfile (tiêu chí 12)
# Railway cấp biến PORT; CMD trong Dockerfile nghe theo ${PORT:-8000}.
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong Railway Variables, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
